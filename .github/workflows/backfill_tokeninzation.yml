name: Backfill 2026 Tokenization Filings

on:
  workflow_dispatch:

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install anthropic supabase; fi

      - name: Run 2026 Tokenization Backfill
        env:
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUBBASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUBBASE_SECRET }}
        run: python backfill_tokenization_2026.py
