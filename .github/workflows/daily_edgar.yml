name: Daily 1940-Act EDGAR Pipeline

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install edgartools anthropic supabase pydantic

      - name: Run 1940-Act EDGAR Scraper
        env:
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUBBASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUBBASE_SECRET }}
        run: python scraper.py

      - name: Generate HTML Brief Preview
        env:
          SUPABASE_URL: ${{ secrets.SUBBASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUBBASE_SECRET }}
        run: python send_brief.py

      - name: Upload Brief Preview Artifact
        uses: actions/upload-artifact@v7
        with:
          path: daily_brief.html
          archive: false
